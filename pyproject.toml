[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caml-tc"
version = "0.1.8"
description = "Carbon-Aware Machine Learning Training Controller"
readme = "README.md"

license = "MIT"

authors = [
  { name = "Sufiyan Ul Rehman", email = "s.rehman@ulster.ac.uk" }
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Distributed Computing",
]
requires-python = ">=3.9"
dependencies = [
  "requests>=2.28.0",
  "numpy>=1.23.0",
  "pandas>=1.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "build", "twine"]

[project.urls]
Homepage = "https://github.com/sufirehman/carbon-aware-ml-scheduler"
Documentation = "https://github.com/sufirehman/carbon-aware-ml-scheduler#readme"
"Live Demo" = "https://carbon-aware-ml-scheduler-ilmd5zrsv44sc6ub3vhbtu.streamlit.app/"
"Bug Tracker" = "https://github.com/sufirehman/carbon-aware-ml-scheduler/issues"
"Research Paper" = "https://ieeexplore.ieee.org"

[tool.setuptools.packages.find]
where = ["."]
include = ["camltc*", "core*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["LICENSE"]